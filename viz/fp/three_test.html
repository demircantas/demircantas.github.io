<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Community Diversity Visualizer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #f0f0f0;
    }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div id="overlay">
    <label for="diversity-slider">Corporate Ownership: <span id="ownership-value">0</span>%</label><br>
    <input type="range" id="diversity-slider" min="0" max="100" value="0">
  </div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
  // Configuration for the clustering behavior
  const clusteringConfig = {
    centerAttraction: 0.001,      // Pulls individuals toward the center
    minSeparation: 2.0,           // Minimum allowed distance between individuals
    attractionStrength: 0.25,     // Force strength for similar individuals
    repulsionStrength: 0.25,      // Force strength for dissimilar individuals
    globalStrength: 0.1,          // Multiplier that scales the overall clustering strength
    damping: 0.9                  // Reduces velocity over time to prevent endless motion
  };

  // Basic Three.js setup
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const raycaster = new THREE.Raycaster(); // For mouse picking / hover detection
  const mouse = new THREE.Vector2();
  let highlighted = null; // Person currently highlighted with mouse

  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Definitions for race and age visuals
  const raceColors = [0x588157, 0x3a7ca5, 0xef476f, 0xffc857]; // Different colors for race
  const ageHeights = [0.2, 0.5, 1.0]; // Height multiplier per age group

  // Grid layout for initial positions
  const cols = 10;
  const rows = 10;
  const spacing = 2;
  const totalPeople = cols * rows;
  const people = [];

  // Class definition for each person in the visualization
  class Person {
    static all = [];

    constructor(index, originalRace, targetRace, ageIndex, targetAgeIndex, educationLevel, targetEducationLevel, x, z) {
      this.index = index;
      this.originalRace = originalRace;
      this.targetRace = targetRace;
      this.ageIndex = ageIndex;
      this.targetAgeIndex = targetAgeIndex;
      this.educationLevel = educationLevel;
      this.targetEducationLevel = targetEducationLevel;

      this.x = x;
      this.z = z;
      this.velocity = new THREE.Vector2();
      this.position2D = new THREE.Vector2(x, z);
      this.originalPosition = this.position2D.clone();

      // Create main cylinder mesh representing the person
      const geometry = new THREE.CylinderGeometry(0.5, 0.5, 0.2, 32);
      const material = new THREE.MeshStandardMaterial({ color: raceColors[this.originalRace], emissive: 0x000000 });
      this.mesh = new THREE.Mesh(geometry, material);
      scene.add(this.mesh);

      // Add a separate mesh to represent education level
      this.eduMesh = this.createEducationMesh(this.educationLevel);
      scene.add(this.eduMesh);

      Person.all.push(this);
    }

    // Returns a shape mesh depending on education level (box, cone, or sphere)
    createEducationMesh(level) {
      let shape;
      switch (level) {
        case 0:
          shape = new THREE.BoxGeometry(0.2, 0.2, 0.2);
          break;
        case 1:
          shape = new THREE.ConeGeometry(0.15, 0.3, 8);
          break;
        case 2:
          shape = new THREE.SphereGeometry(0.15, 16, 16);
          break;
      }
      const material = new THREE.MeshStandardMaterial({ color: 0x222222 });
      return new THREE.Mesh(shape, material);
    }

    // Applies clustering forces to update position
    applyClusteringForce(progress) {
      const pos = this.position2D;
      const vel = this.velocity;
      let force = new THREE.Vector2();
      const strength = progress * clusteringConfig.globalStrength;

      for (const other of Person.all) {
        if (other === this) continue;
        const delta = other.position2D.clone().sub(pos);
        const dist = delta.length();
        const distSq = dist * dist + 0.01;
        const dir = delta.normalize();

        // Repel if too close
        if (dist < clusteringConfig.minSeparation) {
          force.sub(dir.multiplyScalar(0.1 * (clusteringConfig.minSeparation - dist)));
          continue;
        }

        // Attract or repel based on race similarity
        if (other.originalRace === this.originalRace) {
          force.add(dir.multiplyScalar(clusteringConfig.attractionStrength * strength / distSq));
        } else {
          force.sub(dir.multiplyScalar(clusteringConfig.repulsionStrength * strength / distSq));
        }
      }

      // Apply center attraction
      const toCenter = new THREE.Vector2(0, 0).sub(pos);
      force.add(toCenter.multiplyScalar(clusteringConfig.centerAttraction));

      // Integrate force and update position
      vel.add(force);
      vel.multiplyScalar(clusteringConfig.damping);
      pos.add(vel);

      this.x = pos.x;
      this.z = pos.y;
      this.mesh.position.x = this.x;
      this.mesh.position.z = this.z;
      this.eduMesh.position.x = this.x;
      this.eduMesh.position.z = this.z;
    }

    // Updates the person based on current transition progress
    update(progress) {
      const threshold = this.index / totalPeople;

      // Determine whether to use original or target attributes
      const raceIndex = progress >= threshold ? this.targetRace : this.originalRace;
      const ageIndex = progress >= threshold ? this.targetAgeIndex : this.ageIndex;
      const eduLevel = progress >= threshold ? this.targetEducationLevel : this.educationLevel;

      const height = ageHeights[ageIndex];

      // Update visual appearance
      this.mesh.material.color.setHex(raceColors[raceIndex]);
      this.mesh.scale.y = height / 0.2;
      this.mesh.position.y = height / 2;

      // Replace education mesh with new shape
      scene.remove(this.eduMesh);
      this.eduMesh = this.createEducationMesh(eduLevel);
      this.eduMesh.position.set(this.x, height + 0.1, this.z);
      scene.add(this.eduMesh);

      this.applyClusteringForce(progress);
    }
  }

  // --- Initialize population with random original/target demographics ---

  // Final target distribution of races (sums to 100%)
  const finalDistribution = [0.9, 0.05, 0.03, 0.02];
  const finalCounts = finalDistribution.map(p => Math.floor(p * totalPeople));
  while (finalCounts.reduce((a, b) => a + b, 0) < totalPeople) finalCounts[0]++;

  // Assign random original race
  const originalRaceIndices = Array.from({ length: totalPeople }, () => Math.floor(Math.random() * raceColors.length));

  // Shuffle fixed number of each target race
  const targetRaceIndices = [];
  finalCounts.forEach((count, raceIndex) => {
    for (let i = 0; i < count; i++) targetRaceIndices.push(raceIndex);
  });
  for (let i = targetRaceIndices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [targetRaceIndices[i], targetRaceIndices[j]] = [targetRaceIndices[j], targetRaceIndices[i]];
  }

  // Create people and place in grid
  for (let i = 0; i < totalPeople; i++) {
    const ageIndex = Math.floor(Math.random() * ageHeights.length);
    const educationLevel = Math.floor(Math.random() * 3);
    const x = (i % cols - cols / 2) * spacing;
    const z = (Math.floor(i / cols) - rows / 2) * spacing;
    people.push(new Person(i, originalRaceIndices[i], targetRaceIndices[i], ageIndex, 0, educationLevel, 2, x, z));
  }

  // Lighting setup
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(10, 10, 10);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x404040));
  const axesHelper = new THREE.AxesHelper(10);
  scene.add(axesHelper);

  // Camera setup
  camera.position.set(20, 20, 20);
  camera.lookAt(0, 0, 0);

  // --- Main animation loop ---
  let lastProgress = 0;
  function animate() {
    // Raycast to detect hover over people
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(people.map(p => p.mesh));

    // Highlight hovered mesh
    if (highlighted) highlighted.mesh.material.emissive.setHex(0x000000);
    if (intersects.length > 0) {
      highlighted = people.find(p => p.mesh === intersects[0].object);
      if (highlighted) highlighted.mesh.material.emissive.setHex(0x444444);
    } else {
      highlighted = null;
    }

    requestAnimationFrame(animate);

    // Apply clustering physics
    people.forEach(p => p.applyClusteringForce(lastProgress));
    renderer.render(scene, camera);
  }
  animate();

  // --- Slider UI Logic ---
  const slider = document.getElementById("diversity-slider");
  const valueLabel = document.getElementById("ownership-value");

  slider.addEventListener("input", () => {
    const ownership = +slider.value;
    valueLabel.textContent = ownership;
    lastProgress = ownership / 100;
    updateDiversity(lastProgress);
  });

  // Applies transition updates to all people
  function updateDiversity(progress) {
    people.forEach(p => p.update(progress));
  }

  updateDiversity(0);

  // Update mouse coordinates for raycasting
  window.addEventListener("mousemove", event => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  });
</script>

</body>
</html>
